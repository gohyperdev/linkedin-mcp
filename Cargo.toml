[package]
name = "linkedin-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for LinkedIn — publish posts via AI agents"
license = "MIT"
repository = "https://github.com/gohyperdev/linkedin-mcp"

[dependencies]
rmcp = { version = "1.3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
